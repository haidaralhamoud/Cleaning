name: Django checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        database: [sqlite, postgresql]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: cleaning
          POSTGRES_USER: cleaning
          POSTGRES_PASSWORD: ci-only-database-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_TESTING: "1"
      TEST_DATABASE_ENGINE: ${{ matrix.database }}
      POSTGRES_DB: cleaning
      POSTGRES_USER: cleaning
      POSTGRES_PASSWORD: ci-only-database-password
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Generate isolated test key
        run: python -c 'import secrets; print("DJANGO_SECRET_KEY=" + secrets.token_urlsafe(64))' >> "$GITHUB_ENV"
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test --noinput
