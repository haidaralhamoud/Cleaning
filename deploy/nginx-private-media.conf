# Include inside the existing HTTPS server block, before the generic /media/ rule.
# Replace proxy target with the same upstream used by your existing Django location.
location ~ ^/media/(contact_files|applications/cv|incidents|chat_files|email_attachments|request_fixes|booking_media)/ {
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_pass http://127.0.0.1:8000;
}
# The generic public-media location must use `location /media/`, without ^~,
# so private files above cannot bypass Django permissions.
# Add this directive inside the server block too:
client_max_body_size 12m;
